<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-labelledby="litex-core-anatomy-title litex-core-anatomy-description">
  <title id="litex-core-anatomy-title">Anatomy of a LiteX core</title>
  <desc id="litex-core-anatomy-description">Anatomy of a LiteX core. A LiteXModule with, on its control side, CSRStorage and CSRStatus registers (with fields and descriptions) collected by AutoCSR, and an EventManager for the interrupts; on its data side, stream sink/source endpoints and optionally a Wishbone or AXI master (a DMA) or slave (a memory-mapped region); pads to the FPGA I/Os through the generic specials; its logic in sys or another clock domain. From the same class the SoC derives the location on the CSR bus, the interrupt line, the csr.h accessors, the csr.csv/json/svd entries, the host tools' view and the documentation.</desc>
  <!-- LiteX diagram style (doc/diagrams/litex_diagram.py). Generated by doc/diagrams/litex-core-anatomy.py; edit the script (preferred) or this SVG. -->
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="130%"><feGaussianBlur in="SourceAlpha" stdDeviation="2.4" result="b"/><feOffset in="b" dx="3" dy="3" result="o"/><feComponentTransfer in="o" result="s"><feFuncA type="linear" slope="0.32"/></feComponentTransfer><feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g id="litex-core-anatomy" font-family="Calibri, Carlito, 'Liberation Sans', Arial, Helvetica, sans-serif">
  <rect width="1400" height="600" fill="#ffffff"/>
  <polygon points="420,60 958,60 980,82 980,470 442,470 420,448" fill="#e4e4e4" stroke="#7f7f7f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="700" y="90" font-size="18" text-anchor="middle" fill="#1a1a1a" font-weight="bold">class MyCore(LiteXModule)</text>
  <text x="700" y="110" font-size="12" text-anchor="middle" fill="#1a1a1a" font-style="italic">Module + AutoCSR + AutoDoc · litex/soc/cores/&lt;name&gt;.py or your project</text>
  <polygon points="440,130 686,130 700,144 700,215 454,215 440,201" fill="#cdcdcd" stroke="#7f7f7f" stroke-width="1.5" filter="url(#shadow)"/>
