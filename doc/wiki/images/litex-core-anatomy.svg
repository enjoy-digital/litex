  <text x="570.0" y="171.1" font-size="11" text-anchor="middle" fill="#1a1a1a">CSRStorage: software writes</text>
  <text x="570.0" y="185.4" font-size="11" text-anchor="middle" fill="#1a1a1a">CSRStatus: logic writes</text>
  <text x="570.0" y="199.8" font-size="11" text-anchor="middle" fill="#1a1a1a">CSRField · description</text>
  <polygon points="700,130 946,130 960,144 960,215 714,215 700,201" fill="#cdcdcd" stroke="#7f7f7f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="830.0" y="155.9" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">EventManager</text>
  <text x="830.0" y="171.1" font-size="11" text-anchor="middle" fill="#1a1a1a">EventSourcePulse / Process / Level</text>
  <text x="830.0" y="185.4" font-size="11" text-anchor="middle" fill="#1a1a1a">status · pending · enable</text>
  <text x="830.0" y="199.8" font-size="11" text-anchor="middle" fill="#1a1a1a">irq</text>
  <polygon points="440,235 686,235 700,249 700,320 454,320 440,306" fill="#ffffff" stroke="#7f7f7f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="570.0" y="268.1" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Streams</text>
  <text x="570.0" y="283.3" font-size="11" text-anchor="middle" fill="#1a1a1a">self.sink / self.source</text>
  <text x="570.0" y="297.6" font-size="11" text-anchor="middle" fill="#1a1a1a">valid · ready · first · last · payload</text>
  <polygon points="700,235 946,235 960,249 960,320 714,320 700,306" fill="#ffffff" stroke="#7f7f7f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="830.0" y="268.1" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Bus interface (optional)</text>
  <text x="830.0" y="283.3" font-size="11" text-anchor="middle" fill="#1a1a1a">wishbone / AXI master: a DMA</text>
  <text x="830.0" y="297.6" font-size="11" text-anchor="middle" fill="#1a1a1a">or slave: a memory-mapped region</text>
