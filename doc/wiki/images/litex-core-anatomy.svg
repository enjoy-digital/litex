  <text x="1190.0" y="144.9" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">csr.h</text>
  <text x="1190.0" y="159.8" font-size="11" text-anchor="middle" fill="#1a1a1a">mycore_&lt;reg&gt;_read() / _write(), fields</text>
  <polygon points="1020,186 1346,186 1360,200 1360,241 1034,241 1020,227" fill="#ffffff" stroke="#7f7f7f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1190.0" y="210.9" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">csr.csv · csr.json · csr.svd</text>
