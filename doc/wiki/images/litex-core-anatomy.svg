  <text x="200.0" y="283.3" font-size="11" text-anchor="middle" fill="#1a1a1a">bus.add_master / add_slave</text>
  <text x="200.0" y="297.6" font-size="11" text-anchor="middle" fill="#1a1a1a">source.connect(other.sink)</text>
  <polygon points="40,340 346,340 360,354 360,450 54,450 40,436" fill="#f3f3f3" stroke="#7f7f7f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="200.0" y="385.6" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">IRQ handler</text>
  <text x="200.0" y="400.8" font-size="11" text-anchor="middle" fill="#1a1a1a">soc.irq.add("mycore")</text>
  <text x="200.0" y="415.1" font-size="11" text-anchor="middle" fill="#1a1a1a">&lt;MYCORE&gt;_INTERRUPT in soc.h</text>
