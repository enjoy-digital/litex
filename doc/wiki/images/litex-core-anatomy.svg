  <path d="M 700.0,215.0 L 700.0,225.0 L 380.0,225.0 L 380.0,333.0" fill="none" stroke="#595959" stroke-width="1.6" stroke-linejoin="round"/>
  <polygon points="380.0,340.0 376.2,331.0 383.8,331.0" fill="#595959"/>
  <text x="1190" y="100" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="bold" font-style="italic">From the same declaration</text>
