  <text x="200.0" y="178.3" font-size="11" text-anchor="middle" fill="#1a1a1a">a location (csr_paging) per core</text>
  <text x="200.0" y="192.6" font-size="11" text-anchor="middle" fill="#1a1a1a">one bank, registers in order</text>
  <polygon points="40,235 346,235 360,249 360,320 54,320 40,306" fill="#f3f3f3" stroke="#7f7f7f" stroke-width="1.5" filter="url(#shadow)"/>
