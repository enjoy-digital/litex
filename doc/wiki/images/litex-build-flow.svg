<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="litex-build-flow-title litex-build-flow-description">
  <title id="litex-build-flow-title">The LiteX build flow</title>
  <desc id="litex-build-flow-description">The LiteX build flow. The platform file (pins, I/O standards, connectors, clocks, toolchain, programmer) and the target file (the SoC: CPU, memories, cores, buses) are Python; the Builder finalizes the SoC (address map, CSRs, interrupts, constants), generates the software support (csr.h, soc.h, mem.h, git.h, memory.x, csr.csv/json/svd, documentation), builds the BIOS with meson and the CPU's GCC, generates the gateware (top.v and the constraints file) and the toolchain script, runs the vendor or open-source toolchain (or Verilator) to the bitstream, and loads or flashes it with the programmer. Everything lands in build/&lt;platform&gt;/gateware and build/&lt;platform&gt;/software.</desc>
