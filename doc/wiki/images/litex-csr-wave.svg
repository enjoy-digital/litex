  <title id="litex-csr-wave-title">A CSR write and a CSR read</title>
  <desc id="litex-csr-wave-description">Timing diagram of the CSR bus: sys_clk, adr, we, dat_w, re, dat_r and the register's storage over ten cycles. At cycle 2 the bridge drives adr=0x04, we=1 and dat_w=0xcafe: one cycle, and storage becomes 0xcafe at cycle 3. At cycle 5 it drives adr=0x04 and re=1: dat_r carries 0xcafe during cycle 6, the cycle after the address.</desc>
