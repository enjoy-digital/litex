<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="litex-cores-map-title litex-cores-map-description">
  <title id="litex-cores-map-title">The in-tree cores of LiteX, by theme</title>
  <desc id="litex-cores-map-description">The in-tree cores of LiteX by theme. Control and status: timer, watchdog, GPIO, LED chaser and serial LEDs, PWM, identifier, frequency meter, device DNA, XADC and temperature sensors, ICAP, 7-segment, DShot, sigma-delta DAC. Communication: UART with crossover and UARTBone, JTAG (JTAGBone, debug), SPI master and slave, I2C, bit-bang, SPI and BPI flash, FT245 FIFO, USB OHCI, LUNA CDC-ACM, the soft USB2 PHY, CAN-FD, EMIF, 8b10b and PRBS. Memory: HyperRAM controllers, on-chip and vendor memories (SPRAM, LRAM, PSRAM, HBM2), Wishbone DMAs, ECC. Video and audio: timings, framebuffer, terminal, colour bars, VGA, DVI, LCD and HDMI PHYs, TMDS, SPI LCD, OV5640 camera, I2S. Clocking: the PLLs and clock managers of Xilinx, Intel, Lattice, Gowin, Efinix and CologneChip behind one API. Under them, the EventManager for interrupts and the litex.gen helpers (LiteXModule, CDC, Verilog generation).</desc>
  <!-- LiteX diagram style (doc/diagrams/litex_diagram.py). Generated by doc/diagrams/litex-cores-map.py; edit the script (preferred) or this SVG. -->
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="130%"><feGaussianBlur in="SourceAlpha" stdDeviation="2.4" result="b"/><feOffset in="b" dx="3" dy="3" result="o"/><feComponentTransfer in="o" result="s"><feFuncA type="linear" slope="0.32"/></feComponentTransfer><feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g id="litex-cores-map" font-family="Calibri, Carlito, 'Liberation Sans', Arial, Helvetica, sans-serif">
  <rect width="1200" height="620" fill="#ffffff"/>
  <polygon points="30,40 1150,40 1170,60 1170,440 50,440 30,420" fill="#f3f3f3" stroke="#7f7f7f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="600" y="68" font-size="18" text-anchor="middle" fill="#1a1a1a" font-weight="bold">litex/soc/cores/: about forty cores, one file or directory each</text>
  <text x="600" y="86" font-size="12" text-anchor="middle" fill="#1a1a1a" font-style="italic">a LiteXModule with CSRs, an EventManager when it interrupts, streams or a bus when it moves data</text>
  <polygon points="50,100 386,100 400,114 400,260 64,260 50,246" fill="#cdcdcd" stroke="#7f7f7f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="225.0" y="146.2" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Control and status</text>
  <text x="225.0" y="162.8" font-size="12" text-anchor="middle" fill="#1a1a1a">timer, watchdog, GPIO</text>
  <text x="225.0" y="178.3" font-size="12" text-anchor="middle" fill="#1a1a1a">LED chaser, WS2812, PWM, DShot, DAC</text>
  <text x="225.0" y="193.9" font-size="12" text-anchor="middle" fill="#1a1a1a">identifier, frequency meter, device DNA</text>
  <text x="225.0" y="209.5" font-size="12" text-anchor="middle" fill="#1a1a1a">XADC and temperature sensors, ICAP</text>
  <text x="225.0" y="225.1" font-size="12" text-anchor="middle" fill="#1a1a1a">7-segment display</text>
  <polygon points="420,100 766,100 780,114 780,260 434,260 420,246" fill="#cdcdcd" stroke="#7f7f7f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="600.0" y="146.2" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Communication</text>
  <text x="600.0" y="162.8" font-size="12" text-anchor="middle" fill="#1a1a1a">UART, crossover, UARTBone, JTAG, JTAGBone</text>
  <text x="600.0" y="178.3" font-size="12" text-anchor="middle" fill="#1a1a1a">SPI master and slave, I2C, bit-bang</text>
  <text x="600.0" y="193.9" font-size="12" text-anchor="middle" fill="#1a1a1a">SPI, OPI and BPI flash, FT245 FIFO</text>
  <text x="600.0" y="209.5" font-size="12" text-anchor="middle" fill="#1a1a1a">USB: OHCI host, LUNA CDC-ACM, soft USB2 PHY</text>
  <text x="600.0" y="225.1" font-size="12" text-anchor="middle" fill="#1a1a1a">CAN-FD, EMIF, 8b10b, PRBS</text>
  <polygon points="800,100 1136,100 1150,114 1150,260 814,260 800,246" fill="#cdcdcd" stroke="#7f7f7f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="975.0" y="146.2" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Memory</text>
  <text x="975.0" y="162.8" font-size="12" text-anchor="middle" fill="#1a1a1a">HyperRAM controllers and PHYs</text>
  <text x="975.0" y="178.3" font-size="12" text-anchor="middle" fill="#1a1a1a">SPRAM, LRAM, PSRAM, async SRAM</text>
  <text x="975.0" y="193.9" font-size="12" text-anchor="middle" fill="#1a1a1a">Efinix DDR, UltraScale+ HBM2</text>
  <text x="975.0" y="209.5" font-size="12" text-anchor="middle" fill="#1a1a1a">Wishbone DMA reader and writer, ECC</text>
  <text x="975.0" y="225.1" font-size="12" text-anchor="middle" fill="#1a1a1a" font-style="italic">the big ones: LiteDRAM, LiteSPI (ecosystem)</text>
  <polygon points="50,280 386,280 400,294 400,420 64,420 50,406" fill="#cdcdcd" stroke="#7f7f7f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="225.0" y="324.1" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Video and audio</text>
  <text x="225.0" y="340.6" font-size="12" text-anchor="middle" fill="#1a1a1a">timings, framebuffer, terminal, colour bars</text>
  <text x="225.0" y="356.2" font-size="12" text-anchor="middle" fill="#1a1a1a">VGA, DVI, LCD and HDMI PHYs, TMDS</text>
  <text x="225.0" y="371.8" font-size="12" text-anchor="middle" fill="#1a1a1a">SPI LCD, OV5640 camera</text>
  <text x="225.0" y="387.4" font-size="12" text-anchor="middle" fill="#1a1a1a">I2S receiver and transmitter</text>
  <polygon points="420,280 766,280 780,294 780,420 434,420 420,406" fill="#cdcdcd" stroke="#7f7f7f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="600.0" y="316.2" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Clocking</text>
  <text x="600.0" y="332.8" font-size="12" text-anchor="middle" fill="#1a1a1a">S7PLL, S7MMCM, USPLL, USMMCM, USPPLL</text>
  <text x="600.0" y="348.4" font-size="12" text-anchor="middle" fill="#1a1a1a">CycloneVPLL, Max10PLL, Agilex PLLs</text>
  <text x="600.0" y="364.0" font-size="12" text-anchor="middle" fill="#1a1a1a">ECP5PLL, iCE40PLL, NXPLL, GW1NPLL, GW2APLL</text>
  <text x="600.0" y="379.6" font-size="12" text-anchor="middle" fill="#1a1a1a">TRIONPLL, TITANIUMPLL, GateMatePLL</text>
  <text x="600.0" y="395.2" font-size="12" text-anchor="middle" fill="#1a1a1a" font-style="italic">one API: register_clkin(), create_clkout()</text>
  <polygon points="800,280 1136,280 1150,294 1150,420 814,420 800,406" fill="#ffffff" stroke="#7f7f7f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="975.0" y="324.1" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Under every core</text>
  <text x="975.0" y="340.6" font-size="12" text-anchor="middle" fill="#1a1a1a">EventManager: interrupts as CSRs</text>
  <text x="975.0" y="356.2" font-size="12" text-anchor="middle" fill="#1a1a1a">CSRStorage, CSRStatus, CSRField</text>
  <text x="975.0" y="371.8" font-size="12" text-anchor="middle" fill="#1a1a1a">stream.Endpoint, Wishbone and AXI interfaces</text>
  <text x="975.0" y="387.4" font-size="12" text-anchor="middle" fill="#1a1a1a">litex.gen: LiteXModule, CDC, Verilog generation</text>
  <text x="600" y="530" font-size="26" text-anchor="middle" fill="#1a1a1a" font-weight="bold" font-style="italic">The cores inside LiteX, by theme</text>
  <text x="600" y="559" font-size="15" text-anchor="middle" fill="#1a1a1a" font-style="italic">the building blocks every SoC needs; the protocol cores (DRAM, Ethernet, PCIe, SATA...) live in their own repositories</text>
