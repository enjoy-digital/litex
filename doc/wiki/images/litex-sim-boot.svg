  <title id="litex-sim-boot-title">litex_sim: the BIOS boots in the terminal</title>
  <desc id="litex-sim-boot-description">A terminal running litex_sim: Verilator builds the SoC, then the LiteX BIOS prints its banner, the build information, the SoC summary (CPU, bus, CSR width, ROM and SRAM sizes), tries the boot methods and waits at its litex&gt; prompt.</desc>
