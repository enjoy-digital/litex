<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-labelledby="litex-csr-bus-title litex-csr-bus-description">
  <title id="litex-csr-bus-title">The LiteX CSR bus</title>
  <desc id="litex-csr-bus-description">The CSR bus of a LiteX SoC. The CSR bridge (Wishbone2CSR or AXILite2CSR) turns accesses to the csr region of the main bus into CSR bus cycles (adr, re, we, dat_w, dat_r, 8 or 32-bit data, one write cycle, two read cycles). The CSRBankArray gives every core with registers a bank at a location of csr_paging bytes (0x800 by default): bank index times paging plus the register index times 4. A register wider than the bus is split in sub-registers. On the right, what one CSRStorage/CSRStatus declaration produces: the hardware register, the C accessors in csr.h, the lines in csr.csv/json/svd, the documentation, the entry in the host tools.</desc>
