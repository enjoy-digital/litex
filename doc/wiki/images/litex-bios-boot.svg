<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="litex-bios-boot-title litex-bios-boot-description">
  <title id="litex-bios-boot-title">The LiteX BIOS boot flow</title>
  <desc id="litex-bios-boot-description">The LiteX BIOS boot flow. At reset the CPU starts in the ROM where the Builder placed the BIOS. The BIOS initializes the console, prints the banner and the SoC summary, initializes the memories and peripherals present in the SoC (DRAM calibration and memtest, Ethernet, flash, SD card, SATA), then tries the boot methods in order: serial (litex_term --kernel, SFL protocol), SPI flash image, ROM address, SD card, SATA and network (TFTP), each loading boot.bin or the images of boot.json into main RAM before jumping to the application: a bare-metal firmware, an RTOS or OpenSBI + Linux. When nothing boots, the BIOS console is available with its memory, DRAM, Ethernet, storage and flash commands.</desc>
  <!-- LiteX diagram style (doc/diagrams/litex_diagram.py). Generated by doc/diagrams/litex-bios-boot.py; edit the script (preferred) or this SVG. -->
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="130%"><feGaussianBlur in="SourceAlpha" stdDeviation="2.4" result="b"/><feOffset in="b" dx="3" dy="3" result="o"/><feComponentTransfer in="o" result="s"><feFuncA type="linear" slope="0.32"/></feComponentTransfer><feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g id="litex-bios-boot" font-family="Calibri, Carlito, 'Liberation Sans', Arial, Helvetica, sans-serif">
  <rect width="1400" height="700" fill="#ffffff"/>
  <polygon points="30,60 236,60 250,74 250,120 44,120 30,106" fill="#dcdcdc" stroke="#7f7f7f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="140.0" y="88.2" font-size="17" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Reset</text>
  <text x="140.0" y="105.2" font-size="12" text-anchor="middle" fill="#1a1a1a">CPU starts at the reset address</text>
  <path d="M 140.0,120.0 L 140.0,153.0" fill="none" stroke="#595959" stroke-width="1.6" stroke-linejoin="round"/>
  <polygon points="140.0,160.0 136.2,151.0 143.8,151.0" fill="#595959"/>
  <polygon points="30,160 236,160 250,174 250,230 44,230 30,216" fill="#c9c9c9" stroke="#7f7f7f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="140.0" y="185.3" font-size="17" text-anchor="middle" fill="#1a1a1a" font-weight="bold">ROM</text>
  <text x="140.0" y="202.4" font-size="12" text-anchor="middle" fill="#1a1a1a">bios.bin placed by the Builder</text>
  <text x="140.0" y="218.0" font-size="12" text-anchor="middle" fill="#1a1a1a">(integrated_rom, or SPI flash XIP)</text>
  <path d="M 250.0,195.0 L 301.0,195.0" fill="none" stroke="#8c8c8c" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="310.0,195.0 299.0,199.6 299.0,190.4" fill="#8c8c8c"/>
  <polygon points="310,40 676,40 700,64 700,560 334,560 310,536" fill="#f3f3f3" stroke="#7f7f7f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="505" y="70" font-size="22" text-anchor="middle" fill="#1a1a1a" font-weight="bold">LiteX BIOS</text>
  <text x="505" y="90" font-size="13" text-anchor="middle" fill="#1a1a1a" font-style="italic">litex/soc/software/bios</text>
  <polygon points="330,110 666,110 680,124 680,168 344,168 330,154" fill="#ffffff" stroke="#7f7f7f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="505.0" y="136.4" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="bold">1. Console and banner</text>
  <text x="505.0" y="152.9" font-size="12" text-anchor="middle" fill="#1a1a1a">UART, build date, CRC, git sha1, SoC summary</text>
  <polygon points="330,180 666,180 680,194 680,252 344,252 330,238" fill="#ffffff" stroke="#7f7f7f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="505.0" y="205.7" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="bold">2. Initialization</text>
  <text x="505.0" y="222.2" font-size="12" text-anchor="middle" fill="#1a1a1a">DRAM calibration + memtest, HyperRAM, Ethernet (DHCP),</text>
  <text x="505.0" y="237.8" font-size="12" text-anchor="middle" fill="#1a1a1a">SPI flash, SD card, SATA, framebuffer: what the SoC has</text>
  <polygon points="330,264 666,264 680,278 680,322 344,322 330,308" fill="#cdcdcd" stroke="#7f7f7f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="505.0" y="290.4" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="bold">3. Boot sequence</text>
  <text x="505.0" y="306.9" font-size="12" text-anchor="middle" fill="#1a1a1a">the boot methods in order of priority, Q/ESC to abort</text>
  <polygon points="330,334 666,334 680,348 680,392 344,392 330,378" fill="#ffffff" stroke="#7f7f7f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="505.0" y="360.4" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="bold">4. Console</text>
  <text x="505.0" y="376.9" font-size="12" text-anchor="middle" fill="#1a1a1a">help, mem_*, sdram_*, eth_*, sdcard_*, flash_*, boot, reboot</text>
  <path d="M 505.0,168.0 L 505.0,173.0" fill="none" stroke="#595959" stroke-width="1.6" stroke-linejoin="round"/>
  <polygon points="505.0,180.0 501.2,171.0 508.8,171.0" fill="#595959"/>
  <path d="M 505.0,252.0 L 505.0,257.0" fill="none" stroke="#595959" stroke-width="1.6" stroke-linejoin="round"/>
  <polygon points="505.0,264.0 501.2,255.0 508.8,255.0" fill="#595959"/>
  <path d="M 505.0,322.0 L 505.0,327.0" fill="none" stroke="#595959" stroke-width="1.6" stroke-linejoin="round"/>
  <polygon points="505.0,334.0 501.2,325.0 508.8,325.0" fill="#595959"/>
  <text x="505" y="420" font-size="11" text-anchor="middle" fill="#1a1a1a" font-style="italic">nothing booted, or aborted</text>
  <text x="505" y="460" font-size="11" text-anchor="middle" fill="#1a1a1a" font-style="italic">the application never returns</text>
  <path d="M 680.0,293.0 L 751.0,293.0" fill="none" stroke="#8c8c8c" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="760.0,293.0 749.0,297.6 749.0,288.4" fill="#8c8c8c"/>
  <polygon points="760,40 1346,40 1370,64 1370,480 784,480 760,456" fill="#e4e4e4" stroke="#7f7f7f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1065" y="70" font-size="20" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Boot methods, in order</text>
  <text x="1065" y="90" font-size="12" text-anchor="middle" fill="#1a1a1a" font-style="italic">each one present only when the SoC has the core; priority and disable constants</text>
  <polygon points="780,110 1336,110 1350,124 1350,164 794,164 780,150" fill="#ffffff" stroke="#7f7f7f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1065.0" y="134.1" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">serial</text>
  <text x="1065.0" y="150.3" font-size="12" text-anchor="middle" fill="#1a1a1a">litex_term --kernel app.bin: SFL frames over the UART, no media needed</text>
  <polygon points="780,174 1336,174 1350,188 1350,228 794,228 780,214" fill="#ffffff" stroke="#7f7f7f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1065.0" y="198.1" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">flash</text>
  <text x="1065.0" y="214.3" font-size="12" text-anchor="middle" fill="#1a1a1a">image at FLASH_BOOT_ADDRESS in the SPI flash (8-byte header), copied to RAM</text>
  <polygon points="780,238 1336,238 1350,252 1350,292 794,292 780,278" fill="#ffffff" stroke="#7f7f7f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1065.0" y="262.1" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">rom</text>
  <text x="1065.0" y="278.3" font-size="12" text-anchor="middle" fill="#1a1a1a">jump to ROM_BOOT_ADDRESS: an application already in a memory</text>
  <polygon points="780,302 1336,302 1350,316 1350,356 794,356 780,342" fill="#ffffff" stroke="#7f7f7f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1065.0" y="326.1" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">sdcard / sata</text>
  <text x="1065.0" y="342.3" font-size="12" text-anchor="middle" fill="#1a1a1a">FAT partition: boot.json (several images) or boot.bin</text>
  <polygon points="780,366 1336,366 1350,380 1350,420 794,420 780,406" fill="#ffffff" stroke="#7f7f7f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1065.0" y="390.1" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">net</text>
  <text x="1065.0" y="406.3" font-size="12" text-anchor="middle" fill="#1a1a1a">TFTP from REMOTEIP (DHCP optional): boot.json or boot.bin</text>
  <text x="1065" y="450" font-size="11" text-anchor="middle" fill="#1a1a1a" font-style="italic">boot.json: {"Image": "0x40000000", "rv32.dtb": "0x40ef0000", "opensbi.bin": "0x40f00000", "bootargs": {...}}</text>
  <path d="M 1065.0,480.0 L 1065.0,511.0" fill="none" stroke="#8c8c8c" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="1065.0,520.0 1060.4,509.0 1069.6,509.0" fill="#8c8c8c"/>
  <polygon points="760,520 1356,520 1370,534 1370,590 774,590 760,576" fill="#c9c9c9" stroke="#7f7f7f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1065.0" y="552.8" font-size="16" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Main RAM: the application</text>
  <text x="1065.0" y="569.6" font-size="12" text-anchor="middle" fill="#1a1a1a">bare-metal firmware · Zephyr / FreeRTOS / NuttX · OpenSBI + Linux + device tree + rootfs</text>
