<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="litex-standalone-core-title litex-standalone-core-description">
  <title id="litex-standalone-core-title">Exporting LiteX cores and SoCs as Verilog modules</title>
  <desc id="litex-standalone-core-description">Standalone cores. Left: a YAML configuration (or command-line options) goes into a generator: liteeth_gen, litedram_gen, litepcie_gen, litesata_gen, litesdcard_gen, litespi_gen, litenvme_gen, litedsp_gen, usb3_pipe_gen, or litex_soc_gen/litex_periph_gen for a whole SoC. Middle: what comes out: the Verilog module with its memory init files, the constraints and hard IP scripts, the software headers and csr.csv, an instantiation template and documentation. Right: your Vivado, Quartus, Diamond or Yosys project instantiates the module: clock and reset, the pads, an AXI-Lite or Wishbone control port, AXI-Stream or native data ports, interrupts; the host or your CPU uses the headers.</desc>
  <!-- LiteX diagram style (doc/diagrams/litex_diagram.py). Generated by doc/diagrams/litex-standalone-core.py; edit the script (preferred) or this SVG. -->
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="130%"><feGaussianBlur in="SourceAlpha" stdDeviation="2.4" result="b"/><feOffset in="b" dx="3" dy="3" result="o"/><feComponentTransfer in="o" result="s"><feFuncA type="linear" slope="0.32"/></feComponentTransfer><feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
