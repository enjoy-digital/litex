  <text x="165.0" y="255.8" font-size="12" text-anchor="middle" fill="#1a1a1a">or command-line options</text>
  <text x="165" y="325" font-size="11" text-anchor="middle" fill="#1a1a1a" font-style="italic">liteeth_gen examples/udp_s7phyrgmii.yml</text>
  <text x="165" y="343" font-size="11" text-anchor="middle" fill="#1a1a1a" font-style="italic">litex_soc_gen --cpu-type=vexriscv --bus-standard=axi-lite</text>
