<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="917" height="562" viewBox="0 0 917 562" role="img" aria-labelledby="litex-term-boot-title litex-term-boot-description">
  <title id="litex-term-boot-title">litex_term --kernel: the firmware boots</title>
  <desc id="litex-term-boot-description">A terminal running litex_term with --kernel=demo.bin: the BIOS boots, asks for a serial boot, litex_term uploads demo.bin to 0x40000000 and the device executes it (Liftoff!); the demo prints its command list and answers helloc with Hello, world.</desc>
  <!-- LiteX diagram style (doc/diagrams/litex_diagram.py). Generated by doc/diagrams/litex-term-boot.py; edit the script (preferred) or this SVG. -->
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="130%"><feGaussianBlur in="SourceAlpha" stdDeviation="2.4" result="b"/><feOffset in="b" dx="3" dy="3" result="o"/><feComponentTransfer in="o" result="s"><feFuncA type="linear" slope="0.32"/></feComponentTransfer><feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g id="litex-term-boot" font-family="Calibri, Carlito, 'Liberation Sans', Arial, Helvetica, sans-serif">
  <rect width="917" height="562" fill="#ffffff"/>
  <polygon points="206.5,24 696.5,24 710.5,38 710.5,450.0 220.5,450.0 206.5,436.0" fill="#1e1e1e" stroke="#7f7f7f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="224.5" y="54.0" font-size="12" text-anchor="start" fill="#e6e6e6" font-weight="bold" font-family="'Liberation Mono', Cousine, 'DejaVu Sans Mono', Menlo, Consolas, monospace" xml:space="preserve">$ litex_term /tmp/litex_pty0 --kernel=demo.bin</text>
  <text x="224.5" y="69.6" font-size="12" text-anchor="start" fill="#e6e6e6" font-weight="bold" font-family="'Liberation Mono', Cousine, 'DejaVu Sans Mono', Menlo, Consolas, monospace" xml:space="preserve">litex&gt; reboot</text>
  <text x="224.5" y="85.2" font-size="12" text-anchor="start" fill="#9a9a9a" font-family="'Liberation Mono', Cousine, 'DejaVu Sans Mono', Menlo, Consolas, monospace" xml:space="preserve">...</text>
  <text x="224.5" y="100.8" font-size="12" text-anchor="start" fill="#e6e6e6" font-family="'Liberation Mono', Cousine, 'DejaVu Sans Mono', Menlo, Consolas, monospace" xml:space="preserve">--================ Boot ================--</text>
  <text x="224.5" y="116.4" font-size="12" text-anchor="start" fill="#e6e6e6" font-family="'Liberation Mono', Cousine, 'DejaVu Sans Mono', Menlo, Consolas, monospace" xml:space="preserve">Booting from serial...</text>
  <text x="224.5" y="132.0" font-size="12" text-anchor="start" fill="#e6e6e6" font-family="'Liberation Mono', Cousine, 'DejaVu Sans Mono', Menlo, Consolas, monospace" xml:space="preserve">Press Q or ESC to abort boot completely.</text>
  <text x="224.5" y="147.6" font-size="12" text-anchor="start" fill="#e6e6e6" font-family="'Liberation Mono', Cousine, 'DejaVu Sans Mono', Menlo, Consolas, monospace" xml:space="preserve">sL5DdSMmkekro</text>
  <text x="224.5" y="163.2" font-size="12" text-anchor="start" fill="#e6e6e6" font-family="'Liberation Mono', Cousine, 'DejaVu Sans Mono', Menlo, Consolas, monospace" xml:space="preserve">[LITEX-TERM] Received firmware download request from the device.</text>
  <text x="224.5" y="178.8" font-size="12" text-anchor="start" fill="#e6e6e6" font-family="'Liberation Mono', Cousine, 'DejaVu Sans Mono', Menlo, Consolas, monospace" xml:space="preserve">[LITEX-TERM] Uploading demo.bin to 0x40000000 (6136 bytes)...</text>
  <text x="224.5" y="194.4" font-size="12" text-anchor="start" fill="#9a9a9a" font-family="'Liberation Mono', Cousine, 'DejaVu Sans Mono', Menlo, Consolas, monospace" xml:space="preserve">...</text>
  <text x="224.5" y="210.0" font-size="12" text-anchor="start" fill="#e6e6e6" font-family="'Liberation Mono', Cousine, 'DejaVu Sans Mono', Menlo, Consolas, monospace" xml:space="preserve">|==================&gt;  | 92%</text>
  <text x="224.5" y="225.6" font-size="12" text-anchor="start" fill="#e6e6e6" font-family="'Liberation Mono', Cousine, 'DejaVu Sans Mono', Menlo, Consolas, monospace" xml:space="preserve">[LITEX-TERM] Upload complete (10.9KB/s).</text>
  <text x="224.5" y="241.2" font-size="12" text-anchor="start" fill="#e6e6e6" font-family="'Liberation Mono', Cousine, 'DejaVu Sans Mono', Menlo, Consolas, monospace" xml:space="preserve">[LITEX-TERM] Booting the device.</text>
  <text x="224.5" y="256.8" font-size="12" text-anchor="start" fill="#e6e6e6" font-family="'Liberation Mono', Cousine, 'DejaVu Sans Mono', Menlo, Consolas, monospace" xml:space="preserve">[LITEX-TERM] Done.</text>
