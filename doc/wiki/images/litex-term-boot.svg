  <text x="224.5" y="288.0" font-size="12" text-anchor="start" fill="#e6e6e6" font-family="'Liberation Mono', Cousine, 'DejaVu Sans Mono', Menlo, Consolas, monospace" xml:space="preserve">--============== Liftoff! ==============--</text>
  <text x="224.5" y="303.6" font-size="12" text-anchor="start" fill="#e6e6e6" font-family="'Liberation Mono', Cousine, 'DejaVu Sans Mono', Menlo, Consolas, monospace" xml:space="preserve">LiteX minimal demo app built Oct 28 2026 12:32:01</text>
  <text x="224.5" y="319.2" font-size="12" text-anchor="start" fill="#e6e6e6" font-family="'Liberation Mono', Cousine, 'DejaVu Sans Mono', Menlo, Consolas, monospace" xml:space="preserve">Available commands:</text>
  <text x="224.5" y="334.8" font-size="12" text-anchor="start" fill="#e6e6e6" font-family="'Liberation Mono', Cousine, 'DejaVu Sans Mono', Menlo, Consolas, monospace" xml:space="preserve">help               - Show this command</text>
  <text x="224.5" y="350.4" font-size="12" text-anchor="start" fill="#e6e6e6" font-family="'Liberation Mono', Cousine, 'DejaVu Sans Mono', Menlo, Consolas, monospace" xml:space="preserve">reboot             - Reboot CPU</text>
  <text x="224.5" y="366.0" font-size="12" text-anchor="start" fill="#e6e6e6" font-family="'Liberation Mono', Cousine, 'DejaVu Sans Mono', Menlo, Consolas, monospace" xml:space="preserve">donut              - Spinning Donut demo</text>
  <text x="224.5" y="381.6" font-size="12" text-anchor="start" fill="#e6e6e6" font-family="'Liberation Mono', Cousine, 'DejaVu Sans Mono', Menlo, Consolas, monospace" xml:space="preserve">helloc             - Hello C</text>
  <text x="224.5" y="397.2" font-size="12" text-anchor="start" fill="#e6e6e6" font-weight="bold" font-family="'Liberation Mono', Cousine, 'DejaVu Sans Mono', Menlo, Consolas, monospace" xml:space="preserve">litex-demo-app&gt; helloc</text>
  <text x="224.5" y="412.8" font-size="12" text-anchor="start" fill="#e6e6e6" font-family="'Liberation Mono', Cousine, 'DejaVu Sans Mono', Menlo, Consolas, monospace" xml:space="preserve">Hello C demo...</text>
  <text x="224.5" y="428.4" font-size="12" text-anchor="start" fill="#e6e6e6" font-family="'Liberation Mono', Cousine, 'DejaVu Sans Mono', Menlo, Consolas, monospace" xml:space="preserve">C: Hello, world!</text>
  <text x="458.5" y="498.0" font-size="26" text-anchor="middle" fill="#1a1a1a" font-weight="bold" font-style="italic">The demo firmware, booted over serial</text>
  <text x="458.5" y="527.0" font-size="15" text-anchor="middle" fill="#1a1a1a" font-style="italic">litex_term uploads demo.bin when the BIOS asks for it, then shows its console</text>
