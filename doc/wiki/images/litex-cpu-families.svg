<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="litex-cpu-families-title litex-cpu-families-description">
  <title id="litex-cpu-families-title">The CPU families supported by LiteX</title>
  <desc id="litex-cpu-families-description">The CPU families of LiteX. Linux-capable RISC-V: vexriscv_smp (32-bit, 1 to 8 cores), naxriscv (out-of-order, 64-bit), vexiiriscv (64-bit, Debian), rocket (RV64GC), cva6, openc906, blackparrot, and the linux variant of vexriscv. MCU-class RISC-V: vexriscv (the default), neorv32, ibex, cv32e40p and cv32e41p, cva5, veer_eh1, picorv32, coreblocks, kianv, urv, minerva, firev. Tiny RISC-V: serv (bit-serial), fazyrv, femtorv, sentinel. Other ISAs: mor1kx and marocchino (OpenRISC), lm32, microwatt (POWER), cdim and gs232 (MIPS), cortex_m1 and cortex_m3 (Arm). Hard CPUs: zynq7000, zynqmp, cyclonev_hps, agilex_hps, eos_s3, gowin_emcu, gowin_ae350. Emulator: qemu. --cpu-type picks one, --cpu-variant its configuration; the BIOS, the firmware and the tools follow.</desc>
  <!-- LiteX diagram style (doc/diagrams/litex_diagram.py). Generated by doc/diagrams/litex-cpu-families.py; edit the script (preferred) or this SVG. -->
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="130%"><feGaussianBlur in="SourceAlpha" stdDeviation="2.4" result="b"/><feOffset in="b" dx="3" dy="3" result="o"/><feComponentTransfer in="o" result="s"><feFuncA type="linear" slope="0.32"/></feComponentTransfer><feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g id="litex-cpu-families" font-family="Calibri, Carlito, 'Liberation Sans', Arial, Helvetica, sans-serif">
  <rect width="1200" height="600" fill="#ffffff"/>
  <polygon points="30,40 1150,40 1170,60 1170,330 50,330 30,310" fill="#f3f3f3" stroke="#7f7f7f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="600" y="68" font-size="18" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Soft RISC-V cores</text>
  <text x="600" y="86" font-size="12" text-anchor="middle" fill="#1a1a1a" font-style="italic">synthesized in the fabric, one pythondata-cpu-* package or generated at build time</text>
  <polygon points="50,100 396,100 410,114 410,310 64,310 50,296" fill="#cdcdcd" stroke="#7f7f7f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="230.0" y="147.9" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Linux-capable</text>
  <text x="230.0" y="164.4" font-size="12" text-anchor="middle" fill="#1a1a1a">vexriscv_smp: 32-bit, 1 to 8 cores, FPU, coherent DMA</text>
  <text x="230.0" y="180.0" font-size="12" text-anchor="middle" fill="#1a1a1a">naxriscv: out-of-order, 32 or 64-bit</text>
  <text x="230.0" y="195.6" font-size="12" text-anchor="middle" fill="#1a1a1a">vexiiriscv: 64-bit, Linux and Debian, the current line</text>
  <text x="230.0" y="211.2" font-size="12" text-anchor="middle" fill="#1a1a1a">rocket: RV64GC, Chisel, upstream Linux</text>
  <text x="230.0" y="226.8" font-size="12" text-anchor="middle" fill="#1a1a1a">cva6: RV64GC, OpenHW</text>
  <text x="230.0" y="242.3" font-size="12" text-anchor="middle" fill="#1a1a1a">openc906: RV64GCV, T-Head</text>
  <text x="230.0" y="257.9" font-size="12" text-anchor="middle" fill="#1a1a1a">blackparrot: RV64, multicore</text>
  <text x="230.0" y="273.6" font-size="12" text-anchor="middle" fill="#1a1a1a">vexriscv linux: 32-bit, the historical one</text>
  <polygon points="430,100 776,100 790,114 790,310 444,310 430,296" fill="#cdcdcd" stroke="#7f7f7f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="610.0" y="155.7" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="bold">MCU-class</text>
  <text x="610.0" y="172.2" font-size="12" text-anchor="middle" fill="#1a1a1a">vexriscv: the default, ~1000 LUTs and up</text>
  <text x="610.0" y="187.8" font-size="12" text-anchor="middle" fill="#1a1a1a">neorv32: its own peripherals, Zephyr, VHDL</text>
  <text x="610.0" y="203.3" font-size="12" text-anchor="middle" fill="#1a1a1a">ibex, cv32e40p, cv32e41p: lowRISC and OpenHW</text>
  <text x="610.0" y="218.9" font-size="12" text-anchor="middle" fill="#1a1a1a">cva5, veer_eh1: multicore, AXI</text>
  <text x="610.0" y="234.5" font-size="12" text-anchor="middle" fill="#1a1a1a">picorv32: small, slow, robust</text>
  <text x="610.0" y="250.1" font-size="12" text-anchor="middle" fill="#1a1a1a">coreblocks, minerva, sentinel: Amaranth</text>
  <text x="610.0" y="265.7" font-size="12" text-anchor="middle" fill="#1a1a1a">kianv, urv, firev: Verilog, Silice</text>
  <polygon points="810,100 1136,100 1150,114 1150,310 824,310 810,296" fill="#cdcdcd" stroke="#7f7f7f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="980.0" y="155.7" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Tiny</text>
  <text x="980.0" y="172.2" font-size="12" text-anchor="middle" fill="#1a1a1a">serv: bit-serial, a few hundred LUTs</text>
  <text x="980.0" y="187.8" font-size="12" text-anchor="middle" fill="#1a1a1a">fazyrv: chunked, between serial and full</text>
  <text x="980.0" y="203.3" font-size="12" text-anchor="middle" fill="#1a1a1a">femtorv quark to petitbateau: teaching cores</text>
  <text x="980.0" y="218.9" font-size="12" text-anchor="middle" fill="#1a1a1a">sentinel: microcoded</text>
  <text x="980.0" y="234.5" font-size="12" text-anchor="middle" fill="#1a1a1a"></text>
  <text x="980.0" y="250.1" font-size="12" text-anchor="middle" fill="#1a1a1a" font-style="italic">for the BIOS and control firmware</text>
  <text x="980.0" y="265.7" font-size="12" text-anchor="middle" fill="#1a1a1a" font-style="italic">on the smallest FPGAs</text>
  <polygon points="30,350 482,350 500,368 500,490 48,490 30,472" fill="#f3f3f3" stroke="#7f7f7f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="265.0" y="386.2" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Other soft ISAs</text>
  <text x="265.0" y="402.8" font-size="12" text-anchor="middle" fill="#1a1a1a">mor1kx, marocchino: OpenRISC, upstream Linux</text>
  <text x="265.0" y="418.4" font-size="12" text-anchor="middle" fill="#1a1a1a">microwatt: POWER, VHDL, upstream Linux</text>
  <text x="265.0" y="434.0" font-size="12" text-anchor="middle" fill="#1a1a1a">lm32: the MiSoC CPU</text>
  <text x="265.0" y="449.6" font-size="12" text-anchor="middle" fill="#1a1a1a">cdim, gs232: MIPS</text>
  <text x="265.0" y="465.2" font-size="12" text-anchor="middle" fill="#1a1a1a">cortex_m1, cortex_m3: Arm DesignStart, your own RTL</text>
  <polygon points="520,350 902,350 920,368 920,490 538,490 520,472" fill="#dcdcdc" stroke="#7f7f7f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="720.0" y="386.2" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Hard CPUs of SoC-FPGAs</text>
  <text x="720.0" y="402.8" font-size="12" text-anchor="middle" fill="#1a1a1a">zynq7000, zynqmp: Arm Cortex-A9, A53 and R5</text>
  <text x="720.0" y="418.4" font-size="12" text-anchor="middle" fill="#1a1a1a">cyclonev_hps, agilex_hps: Intel HPS</text>
  <text x="720.0" y="434.0" font-size="12" text-anchor="middle" fill="#1a1a1a">eos_s3, gowin_emcu: Cortex-M4F and M3</text>
  <text x="720.0" y="449.6" font-size="12" text-anchor="middle" fill="#1a1a1a">gowin_ae350: AndesCore RISC-V</text>
  <text x="720.0" y="465.2" font-size="12" text-anchor="middle" fill="#1a1a1a" font-style="italic">the BIOS runs on them too</text>
  <polygon points="940,350 1152,350 1170,368 1170,490 958,490 940,472" fill="#f8f8f8" stroke="#7f7f7f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1055.0" y="401.9" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Emulator</text>
  <text x="1055.0" y="418.4" font-size="12" text-anchor="middle" fill="#1a1a1a">qemu: the CPU in QEMU,</text>
  <text x="1055.0" y="434.0" font-size="12" text-anchor="middle" fill="#1a1a1a">the SoC in Verilator</text>
  <text x="1055.0" y="449.6" font-size="12" text-anchor="middle" fill="#1a1a1a">(co-simulation)</text>
  <text x="600" y="530" font-size="26" text-anchor="middle" fill="#1a1a1a" font-weight="bold" font-style="italic">Thirty-two soft CPUs, seven hard ones, one emulator</text>
  <text x="600" y="559" font-size="15" text-anchor="middle" fill="#1a1a1a" font-style="italic">--cpu-type picks one, --cpu-variant its configuration; the BIOS, the firmware and the tools follow</text>
  <image x="1040" y="503" width="148" height="85" xlink:href="data:image/png;base64,"/>
  </g>
</svg>
