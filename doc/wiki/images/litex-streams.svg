<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="litex-streams-title litex-streams-description">
  <title id="litex-streams-title">LiteX streams</title>
  <desc id="litex-streams-description">LiteX streams. Top: a source endpoint connected to a sink endpoint, with the signals of the handshake (valid from the source, ready from the sink, a transfer on each cycle where both are set), the packet delimiters first and last, the payload record (data, byte enables...) that changes on every transfer and the param record that changes at each start of packet. Bottom: a pipeline of generic blocks between a PHY and a DMA: a width converter, a FIFO, a clock domain crossing, a packetizer adding a header, each with its sink and source.</desc>
  <!-- LiteX diagram style (doc/diagrams/litex_diagram.py). Generated by doc/diagrams/litex-streams.py; edit the script (preferred) or this SVG. -->
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="130%"><feGaussianBlur in="SourceAlpha" stdDeviation="2.4" result="b"/><feOffset in="b" dx="3" dy="3" result="o"/><feComponentTransfer in="o" result="s"><feFuncA type="linear" slope="0.32"/></feComponentTransfer><feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g id="litex-streams" font-family="Calibri, Carlito, 'Liberation Sans', Arial, Helvetica, sans-serif">
  <rect width="1400" height="560" fill="#ffffff"/>
  <text x="700" y="44" font-size="17" text-anchor="middle" fill="#1a1a1a" font-weight="bold">An endpoint: source.connect(sink)</text>
  <polygon points="120,70 446,70 460,84 460,230 134,230 120,216" fill="#cdcdcd" stroke="#7f7f7f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="290.0" y="130.9" font-size="18" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Source</text>
  <text x="290.0" y="149.3" font-size="13" text-anchor="middle" fill="#1a1a1a">a module's .source</text>
  <text x="290.0" y="166.2" font-size="13" text-anchor="middle" fill="#1a1a1a">drives valid, first, last, payload, param</text>
  <text x="290.0" y="183.2" font-size="13" text-anchor="middle" fill="#1a1a1a">waits for ready</text>
  <polygon points="940,70 1266,70 1280,84 1280,230 954,230 940,216" fill="#cdcdcd" stroke="#7f7f7f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1110.0" y="130.9" font-size="18" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Sink</text>
  <text x="1110.0" y="149.3" font-size="13" text-anchor="middle" fill="#1a1a1a">a module's .sink</text>
  <text x="1110.0" y="166.2" font-size="13" text-anchor="middle" fill="#1a1a1a">drives ready</text>
  <text x="1110.0" y="183.2" font-size="13" text-anchor="middle" fill="#1a1a1a">samples the word when valid &amp; ready</text>
  <path d="M 460.0,100.0 L 933.0,100.0" fill="none" stroke="#595959" stroke-width="1.6" stroke-linejoin="round"/>
  <polygon points="940.0,100.0 931.0,103.8 931.0,96.2" fill="#595959"/>
  <text x="700" y="90" font-size="12" text-anchor="middle" fill="#1a1a1a" font-style="italic">valid: a word is present</text>
  <path d="M 940.0,130.0 L 467.0,130.0" fill="none" stroke="#595959" stroke-width="1.6" stroke-linejoin="round"/>
  <polygon points="460.0,130.0 469.0,126.2 469.0,133.8" fill="#595959"/>
  <text x="700" y="120" font-size="12" text-anchor="middle" fill="#1a1a1a" font-style="italic">ready: the sink accepts it</text>
  <path d="M 460.0,160.0 L 933.0,160.0" fill="none" stroke="#595959" stroke-width="1.6" stroke-linejoin="round"/>
  <polygon points="940.0,160.0 931.0,163.8 931.0,156.2" fill="#595959"/>
  <text x="700" y="150" font-size="12" text-anchor="middle" fill="#1a1a1a" font-style="italic">first · last: packet delimiters (optional)</text>
  <path d="M 460.0,190.0 L 933.0,190.0" fill="none" stroke="#595959" stroke-width="1.6" stroke-linejoin="round"/>
  <polygon points="940.0,190.0 931.0,193.8 931.0,186.2" fill="#595959"/>
  <text x="700" y="180" font-size="12" text-anchor="middle" fill="#1a1a1a" font-style="italic">payload: data, be, ...: a Record, new on each transfer</text>
  <path d="M 460.0,220.0 L 933.0,220.0" fill="none" stroke="#595959" stroke-width="1.6" stroke-linejoin="round"/>
  <polygon points="940.0,220.0 931.0,223.8 931.0,216.2" fill="#595959"/>
  <text x="700" y="210" font-size="12" text-anchor="middle" fill="#1a1a1a" font-style="italic">param: length, ...: a Record, new at each packet (optional)</text>
  <text x="700" y="258" font-size="12" text-anchor="middle" fill="#1a1a1a" font-style="italic">stream.Endpoint([("data", 32), ("be", 4)])   ·   stream.EndpointDescription(payload_layout, param_layout)</text>
  <text x="700" y="310" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">A pipeline: stream.Pipeline(phy, Converter(8, 32), SyncFIFO(layout, 64), ClockDomainCrossing(...), Packetizer(...), dma.sink)</text>
  <polygon points="40,340 221,340 235,354 235,430 54,430 40,416" fill="#c9c9c9" stroke="#7f7f7f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="137.5" y="374.3" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">PHY</text>
  <text x="137.5" y="390.5" font-size="12" text-anchor="middle" fill="#1a1a1a">source: 8-bit bytes</text>
  <text x="137.5" y="406.1" font-size="12" text-anchor="middle" fill="#1a1a1a">rx clock domain</text>
  <path d="M 235.0,385.0 L 256.0,385.0" fill="none" stroke="#8c8c8c" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="265.0,385.0 254.0,389.6 254.0,380.4" fill="#8c8c8c"/>
  <polygon points="265,340 446,340 460,354 460,430 279,430 265,416" fill="#ffffff" stroke="#7f7f7f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="362.5" y="374.3" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Converter(8, 32)</text>
  <text x="362.5" y="390.5" font-size="12" text-anchor="middle" fill="#1a1a1a">8 to 32 bits</text>
  <text x="362.5" y="406.1" font-size="12" text-anchor="middle" fill="#1a1a1a">keeps first / last / be</text>
  <path d="M 460.0,385.0 L 481.0,385.0" fill="none" stroke="#8c8c8c" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="490.0,385.0 479.0,389.6 479.0,380.4" fill="#8c8c8c"/>
  <polygon points="490,340 671,340 685,354 685,430 504,430 490,416" fill="#ffffff" stroke="#7f7f7f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="587.5" y="374.3" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">SyncFIFO(layout, 64)</text>
  <text x="587.5" y="390.5" font-size="12" text-anchor="middle" fill="#1a1a1a">64 words</text>
  <text x="587.5" y="406.1" font-size="12" text-anchor="middle" fill="#1a1a1a">buffering, backpressure</text>
  <path d="M 685.0,385.0 L 706.0,385.0" fill="none" stroke="#8c8c8c" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="715.0,385.0 704.0,389.6 704.0,380.4" fill="#8c8c8c"/>
  <polygon points="715,340 896,340 910,354 910,430 729,430 715,416" fill="#ffffff" stroke="#7f7f7f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="812.5" y="374.3" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">ClockDomainCrossing</text>
  <text x="812.5" y="390.5" font-size="12" text-anchor="middle" fill="#1a1a1a">rx to sys</text>
  <text x="812.5" y="406.1" font-size="12" text-anchor="middle" fill="#1a1a1a">AsyncFIFO inside</text>
  <path d="M 910.0,385.0 L 931.0,385.0" fill="none" stroke="#8c8c8c" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="940.0,385.0 929.0,389.6 929.0,380.4" fill="#8c8c8c"/>
  <polygon points="940,340 1121,340 1135,354 1135,430 954,430 940,416" fill="#ffffff" stroke="#7f7f7f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1037.5" y="374.3" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Packetizer(header)</text>
  <text x="1037.5" y="390.5" font-size="12" text-anchor="middle" fill="#1a1a1a">adds the header</text>
  <text x="1037.5" y="406.1" font-size="12" text-anchor="middle" fill="#1a1a1a">length, destination, ...</text>
  <path d="M 1135.0,385.0 L 1156.0,385.0" fill="none" stroke="#8c8c8c" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="1165.0,385.0 1154.0,389.6 1154.0,380.4" fill="#8c8c8c"/>
  <polygon points="1165,340 1346,340 1360,354 1360,430 1179,430 1165,416" fill="#c9c9c9" stroke="#7f7f7f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1262.5" y="374.3" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">DMA</text>
  <text x="1262.5" y="390.5" font-size="12" text-anchor="middle" fill="#1a1a1a">sink: words to memory</text>
  <text x="1262.5" y="406.1" font-size="12" text-anchor="middle" fill="#1a1a1a">Wishbone / AXI master</text>
  <text x="700" y="462" font-size="12" text-anchor="middle" fill="#1a1a1a" font-style="italic">every arrow is a full stream: valid / ready / first / last / payload (/ param), connected by .source -&gt; .sink</text>
  <text x="700" y="510" font-size="26" text-anchor="middle" fill="#1a1a1a" font-weight="bold" font-style="italic">Streams: one interface for every data path</text>
  <text x="700" y="539" font-size="15" text-anchor="middle" fill="#1a1a1a" font-style="italic">AXI-Stream and Avalon-ST map to it directly: tvalid/tready/tlast/tdata/tkeep/tuser are valid/ready/last/data/be/param</text>
  <image x="1240" y="463" width="148" height="85" xlink:href="data:image/png;base64,"/>
  </g>
</svg>
