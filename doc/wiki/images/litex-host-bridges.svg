<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="litex-host-bridges-title litex-host-bridges-description">
  <title id="litex-host-bridges-title">LiteX host bridges</title>
  <desc id="litex-host-bridges-description">LiteX host bridges. On the host, the user scripts (RemoteClient), litex_cli, the LiteScope client, litex_term's crossover console and the GUI talk to litex_server over TCP (Etherbone packets, port 1234). litex_server drives one transport: a serial port (UARTBone), OpenOCD (JTAGBone), UDP (Etherbone over LiteEth), the LitePCIe kernel driver (PCIe), USB, or /dev/mem on a hard CPU. In the FPGA the matching bridge is a bus master on the SoC's main bus, so the host reads and writes every CSR, memory and core, including LiteScope's capture buffer.</desc>
